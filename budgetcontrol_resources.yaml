# Reporting Function - IAM Role and IAM Policy for Reporting Lambda
  ActionsTakenReportingLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref 'AWS::AccountId'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole  # For CloudWatch Logs
      Policies:
        - PolicyName: ActionsTakenReportingLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # DynamoDB Read Only
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt AuditResouceInfoActionStatus.Arn
              
              # Step Functions Read Only
              - Effect: Allow
                Action:
                  - states:DescribeExecution
                  - states:DescribeStateMachine
                  - states:ListExecutions
                  - states:ListStateMachines
                Resource: !Ref StateMachineBudgetControl
              
              # SNS Publish
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref awsconfigbudgetcontrolnotificationtopic
              
              # KMS permissions for SNS encryption
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey*
                Resource: !GetAtt SNSEncryptionKey.Arn

# Reporting Function - Lambda Function
  ActionsTakenReportingFunction:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W92
            reason: >-
              This deployment is configured for simplified demonstration purposes. For production environments, we recommend configuring appropriate concurrency limits based on your organization's usage patterns and performance requirements
          - id: W89
            reason: >-
              This deployment is configured for simplified demonstration purposes. For production environments, we recommend deploying these resources within your VPC to enhance network security and meet your organization's compliance requirements
          - id: W58
            reason: The Lambda function has required permissions to write operational logs to CloudWatch         
    Properties:
      FunctionName: aws-config-demo-lambda-reporting-actions
      Description: This is demo lambda to send the report of the actions taken on the resources by the step functions
      Runtime: python3.13
      Handler: index.lambda_handler
      Timeout: 900
      MemorySize: 128         
      Role: !GetAtt ActionsTakenReportingLambdaRole.Arn
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !GetAtt AuditResouceInfoActionStatus.Arn
          SNS_TOPIC_ARN: !Ref awsconfigbudgetcontrolnotificationtopic
      Code:
        ZipFile: |
          import boto3
          import json
          import os
          dynamodb = boto3.resource('dynamodb')
          sns = boto3.client('sns')
          from boto3.dynamodb.conditions import Key

          def create_table_format(items):
              # Define column headers and their widths with more spacing
              columns = {
                  'Resource ID': 35,
                  'Resource Type': 40,
                  'Action Details': 45
              }
              
              def wrap_text(text, width):
                  """Helper function to wrap text to specified width"""
                  words = str(text).split()
                  lines = []
                  current_line = []
                  current_length = 0
                  
                  for word in words:
                      if current_length + len(word) + 1 <= width:
                          current_line.append(word)
                          current_length += len(word) + 1
                      else:
                          if current_line:
                              lines.append(' '.join(current_line))
                          current_line = [word]
                          current_length = len(word)
                  
                  if current_line:
                      lines.append(' '.join(current_line))
                      
                  return lines if lines else ['']

              # Create header
              header = '|'
              separator = '|'
              for col, width in columns.items():
                  header += f' {col:<{width}} |'
                  separator += '-' * (width + 2) + '|'

              # Create rows
              rows = []
              for item in items:
                  resource_id = item.get('ResourceId', '')
                  resource_type = item.get('ResourceType', '')
                  action_details = item.get('ActionDetails', '')

                  # Wrap text for each column
                  wrapped_id = wrap_text(resource_id, columns['Resource ID'])
                  wrapped_type = wrap_text(resource_type, columns['Resource Type'])
                  wrapped_details = wrap_text(action_details, columns['Action Details'])

                  # Get maximum number of lines needed for this row
                  max_lines = max(len(wrapped_id), len(wrapped_type), len(wrapped_details))

                  # Pad wrapped text arrays to match max_lines
                  wrapped_id.extend([''] * (max_lines - len(wrapped_id)))
                  wrapped_type.extend([''] * (max_lines - len(wrapped_type)))
                  wrapped_details.extend([''] * (max_lines - len(wrapped_details)))

                  # Create each line of the row
                  for i in range(max_lines):
                      row = '|'
                      row += f' {wrapped_id[i]:<{columns["Resource ID"]}} |'
                      row += f' {wrapped_type[i]:<{columns["Resource Type"]}} |'
                      row += f' {wrapped_details[i]:<{columns["Action Details"]}} |'
                      rows.append(row)

              # Combine all parts
              table = '\n'.join([
                  header,
                  separator,
                  '\n'.join(rows)
              ])

              return table

          def lambda_handler(event, context):
              print("Starting lambda execution")
              print(f"Received event: {json.dumps(event)}")
              
              table = dynamodb.Table(os.environ['DYNAMODB_TABLE_NAME'])
              try:
                # Extract execution ID from the 'name' field
                execution_id = event['detail']['name']
                print(f"Extracted execution ID: {execution_id}")
                
                # Query DynamoDB for items matching the execution_id
                response = table.query(
                    KeyConditionExpression=Key('ExecutionID').eq(execution_id)
                )
                
                # Get items from response
                items = response.get('Items', [])
                
                # Print items for debugging
                print(f"Number of items found: {len(items)}")
                print("Items retrieved from DynamoDB:")
                for item in items:
                    print(json.dumps(item, indent=2))
                
                if items:
                    # Format items into table
                    formatted_message = create_table_format(items)
                    
                    # Send formatted message to SNS
                    sns_response = sns.publish(
                        TopicArn=os.environ['SNS_TOPIC_ARN'],
                        Subject='AWS Budget Control Actions Report',
                        Message=formatted_message
                    )
                    print(f"Message sent to SNS: {sns_response}")
                
                return {
                    'statusCode': 200,
                    'body': 'Successfully processed and sent notification'
                }
              
              except KeyError as e:
                  print(f"Error: Missing key - {str(e)}")
                  return {
                      'statusCode': 400,
                      'body': f'Missing required field in event: {str(e)}'
                  }
              except Exception as e:
                  print(f"Unexpected error: {str(e)}")
                  return {
                      'statusCode': 500,
                      'body': f'Error processing event: {str(e)}'
                  }

# Reporting Function - Event Bridge Rule:
  BudgetsActionReportEventBridgeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: budgets-control-actions-reporting-SFSuccessfulExecution
      Description: "Rule to capture successful executions of the Budget Control state machine"
      State: ENABLED
      EventPattern:
        source:
          - aws.states
        detail-type:
          - Step Functions Execution Status Change
        detail:
          status:
            - SUCCEEDED
          stateMachineArn:
            - !Ref StateMachineBudgetControl
      Targets:
        - Arn: !GetAtt ActionsTakenReportingFunction.Arn  # Replace with your target resource
          Id: "ProcessSuccessfulExecution"
  # Permission for EventBridge to invoke the target
  TargetPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ActionsTakenReportingFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt BudgetsActionReportEventBridgeRule.Arn

  StateMachineBudgetControl:
    Type: 'AWS::StepFunctions::StateMachine'
    Properties:
      DefinitionString: !Sub |
          {             
              "Comment": "State machine to trigger the config rule and re-evaluate the resources and take actions",
              "StartAt": "ConfigRulesEvaluation",
              "States": {
                "ConfigRulesEvaluation": {
                  "Type": "Task",
                  "Resource": "arn:aws:states:::aws-sdk:config:startConfigRulesEvaluation",
                  "Parameters": {
                    "ConfigRuleNames": [
                      "${awscustomlambdaconfigdemorule}"
                    ]
                  },
                  "Next": "WaitForRuleEvaluationtoComplete"
                },
                "WaitForRuleEvaluationtoComplete": {
                  "Type": "Wait",
                  "Seconds": 60,
                  "Next": "ConfigRuleEvaluationStatus"
                },
                "ConfigRuleEvaluationStatus": {
                  "Type": "Task",
                  "Resource": "arn:aws:states:::aws-sdk:config:describeConfigRuleEvaluationStatus",
                  "Parameters": {
                    "ConfigRuleNames": [
                      "${awscustomlambdaconfigdemorule}"
                    ]
                  },
                  "Next": "CheckEvaluationTime"
                },
                "CheckEvaluationTime": {
                  "Type": "Choice",
                  "Choices": [
                    {
                      "Variable": "$.ConfigRulesEvaluationStatus[0].LastSuccessfulEvaluationTime",
                      "StringGreaterThanPath": "$$.Execution.StartTime",
                      "Next": "Query"
                    }
                  ],
                  "Default": "WaitForRuleEvaluationtoComplete"
                },
                "Query": {
                  "Type": "Task",
                  "Parameters": {
                    "TableName": "${AuditResourceInfoDefaultTag }",
                    "FilterExpression": "TagApplied IN (:tagValue1, :tagValue2, :tagValue3) AND ActionStatus = :actionTakenValue",
                    "ExpressionAttributeValues": {
                      ":tagValue1": {
                        "S": "Stop"
                      },
                      ":tagValue2": {
                        "S": "Inform"
                      },
                      ":tagValue3": {
                        "S": "Terminate"
                      },
                      ":actionTakenValue": {
                        "S": "pending"
                      }
                    }
                  },
                  "Resource": "arn:aws:states:::aws-sdk:dynamodb:scan",
                  "ResultSelector": {
                    "Items.$": "$.Items"
                  },
                  "Next": "Map"
                },
                "Map": {
                  "Type": "Map",
                  "ItemProcessor": {
                    "ProcessorConfig": {
                      "Mode": "INLINE"
                    },
                    "StartAt": "Extract_InstanceId",
                    "States": {
                      "Extract_InstanceId": {
                        "Type": "Pass",
                        "Parameters": {
                          "InstanceId.$": "$.ResourceId.S",
                          "TagApplied.$": "$.TagApplied.S",
                          "ResourceType.$": "$.ResourceType.S",
                          "AuditTimestamp.$": "$.AuditTimestamp"
                        },
                        "Next": "ResourceType_Choice"
                      },
                      "ResourceType_Choice": {
                        "Type": "Choice",
                        "Choices": [
                          {
                            "Variable": "$.ResourceType",
                            "StringEquals": "AWS::SageMaker::NotebookInstance",
                            "Next": "SageMaker_DescribeNotebookInstance"
                          },
                          {
                            "Variable": "$.ResourceType",
                            "StringEquals": "AWS::EC2::Instance",
                            "Next": "EC2_Describe_Instance_Status"
                          },
                          {
                            "Variable": "$.ResourceType",
                            "StringEquals": "AWS::OpenSearchServerless::Collection",
                            "Next": "CheckCollectionStatus"
                          },
                          {
                            "Variable": "$.ResourceType",
                            "StringEquals": "AWS::OpenSearch::Domain",
                            "Next": "CheckOSDomainStatus"
                          },
                          {
                            "Variable": "$.ResourceType",
                            "StringEquals": "AWS::SageMaker::Domain",
                            "Next": "SageMakerDomainPass"
                          },
                          {
                            "Variable": "$.ResourceType",
                            "StringEquals": "AWS::RDS::DBCluster",
                            "Next": "RDSClusterPass"
                          }
                        ],
                        "Default": "Delete_AuditResourceInfoDefaultTag _From_Default"
                      },
                      "CheckCollectionStatus": {
                        "Type": "Task",
                        "Resource": "arn:aws:states:::aws-sdk:opensearchserverless:batchGetCollection",
                        "Parameters": {
                          "Names.$": "States.Array($.InstanceId)"
                        },
                        "ResultPath": "$.status",
                        "Next": "IsCollectionActive"
                      },
                      "CheckOSDomainStatus": {
                        "Type": "Task",
                        "Resource": "arn:aws:states:::aws-sdk:opensearch:describeDomains",
                        "Parameters": {
                          "DomainNames.$": "States.Array($.InstanceId)"
                        },
                        "ResultPath": "$.status",
                        "Next": "IsOSDomainCreationInProgress"
                      },
                      "IsCollectionActive": {
                        "Type": "Choice",
                        "Choices": [
                          {
                            "Variable": "$.status.CollectionDetails[0].Status",
                            "StringEquals": "ACTIVE",
                            "Next": "Inform or Terminate Collection"
                          },
                          {
                            "Variable": "$.status.CollectionDetails[0].Status",
                            "StringEquals": "CREATING",
                            "Next": "WaitForCollectionCreation"
                          },
                          {
                            "Variable": "$.status.CollectionDetails[0].Status",
                            "StringEquals": "DELETING",
                            "Next": "WaitForCollectionDeletion"
                          }
                        ],
                        "Default": "CollectionNotFound"
                      },
                      "IsOSDomainCreationInProgress": {
                        "Type": "Choice",
                        "Choices": [
                          {
                            "Variable": "$.status.DomainStatusList[0].Created",
                            "BooleanEquals": true,
                            "Next": "Inform or Terminate OS Domain"
                          },
                          {
                            "Variable": "$.status.DomainStatusList[0].Created",
                            "BooleanEquals": false,
                            "Next": "WaitForOSDomainCreation"
                          }
                        ],
                        "Default": "OSDomainNotFound"
                      },
                      "Inform or Terminate Collection": {
                        "Type": "Choice",
                        "Choices": [
                          {
                            "Variable": "$.TagApplied",
                            "StringEquals": "Terminate",
                            "Next": "DeleteCollection"
                          },
                          {
                            "Variable": "$.TagApplied",
                            "StringEquals": "Inform",
                            "Next": "Update_Action_Status_Collection_Inform"
                          }
                        ],
                        "Default": "Update_Action_Status_Collection_Unknown_Tag"
                      },
                      "Inform or Terminate OS Domain": {
                        "Type": "Choice",
                        "Choices": [
                          {
                            "Variable": "$.TagApplied",
                            "StringEquals": "Terminate",
                            "Next": "DeleteOSDomain"
                          },
                          {
                            "Variable": "$.TagApplied",
                            "StringEquals": "Inform",
                            "Next": "Update_Action_Status_OSDomain_Inform"
                          }
                        ],
                        "Default": "Update_Action_Status_OSDomain_Unknown_Tag"
                      },
                      "Update_Action_Status_OSDomain_Unknown_Tag": {
                        "Type": "Task",
                        "Resource": "arn:aws:states:::aws-sdk:dynamodb:updateItem",
                        "Parameters": {
                          "TableName": "${AuditResouceInfoActionStatus}",
                          "Key": {
                            "ExecutionID": {
                              "S.$": "$$.Execution.Name"
                            },
                            "ActionTimestamp": {
                              "S.$": "States.Format('{}-{}', $$.State.EnteredTime, States.UUID())"
                            }                            
                          },
                          "UpdateExpression": "SET ResourceId = :ResourceId, ActionStatus = :completed, ActionDetails = :unknownTag,  AuditTimestamp = :auditTimestamp, ResourceType = :resourceType, TagApplied = :tag",
                          "ExpressionAttributeValues": {
                            ":completed": {
                              "S": "completed"
                            },
                            ":unknownTag": {
                              "S": "Stop - OSDomain cannot be stopped"
                            },
                            ":ResourceId": {
                              "S.$": "$.InstanceId"
                            },
                            ":auditTimestamp": {
                              "S.$": "$.AuditTimestamp"
                            },
                            ":resourceType": {
                              "S.$": "$.ResourceType"
                            },
                            ":tag": {
                              "S.$": "$.TagApplied"
                            }
                          }
                        },
                        "ResultPath": null,
                        "Next": "Delete_AuditResourceInfoDefaultTag _From_OSDomain"
                      },
                      "Update_Action_Status_Collection_Unknown_Tag": {
                        "Type": "Task",
                        "Resource": "arn:aws:states:::aws-sdk:dynamodb:updateItem",
                        "Parameters": {
                          "TableName": "${AuditResouceInfoActionStatus}",
                          "Key": {
                            "ExecutionID": {
                              "S.$": "$$.Execution.Name"
                            },
                            "ActionTimestamp": {
                              "S.$": "States.Format('{}-{}', $$.State.EnteredTime, States.UUID())"
