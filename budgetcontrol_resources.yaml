  awsconfigcustomlambdaServiceRoleDefaultPolicy:
    Type: AWS::IAM::Policy
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W12
            reason: >-
              This policy requires broader resource access to effectively manage tagging across multiple SageMaker notebook instances throughout your AWS environment. Restricting to specific resources would prevent the automated tagging functionality from working properly as new notebook instances are created       
    Properties:
      PolicyDocument:
