      RoleArn: !GetAtt 'SFBudgetControlRole.Arn'
      LoggingConfiguration:
        Level: "ALL"
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn      


  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/states/${AWS::StackName}-StateMachineBudgetControl"
      RetentionInDays: 14
      
  SFBudgetControlRole:
      Type: 'AWS::IAM::Role'
      Metadata:
        cfn_nag:
          rules_to_suppress:
            - id: W11
              reason: "This solution is to demonstrate how customers can control the costs based on the resource tags, we cannot limit the policy to a resource as the solution will take actions on resources based on tags"     
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Principal:
              Service: !Sub 'states.${AWS::Region}.amazonaws.com'              
            Action: 'sts:AssumeRole'
        ManagedPolicyArns:
          - "arn:aws:iam::aws:policy/CloudWatchLogsFullAccess"            
        Policies:
        # Policy 1: Read-only access policies
        - PolicyName: ReadOnlyAccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
            - Action: 
                - sagemaker:ListNotebookInstances
                - sagemaker:ListApps
                - sagemaker:ListTags
                - sagemaker:ListSpaces
                - sagemaker:ListUserProfiles
                - sagemaker:DescribeDomain
                - sagemaker:DescribeNotebookInstance
                - ec2:describeInstances
                - aoss:ListCollections
                - aoss:BatchGetCollection             
                - es:DescribeDomains
                - rds:AddTagsToResource
              Effect: Allow
              Resource: "*"
    
        # Policy 2: SageMaker management actions
        - PolicyName: SageMakerManagementPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
            - Effect: Allow
              Action:
                - sagemaker:StopNotebookInstance
              Resource: 
                Fn::Sub: arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:notebook-instance/*
              Condition:
                StringEquals:
                  sagemaker:ResourceTag/BudgetControlAction: ['Terminate','Stop']
            - Effect: Allow
              Action:
                - sagemaker:DeleteNotebookInstance
              Resource: 
                Fn::Sub: arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:notebook-instance/*
              Condition:
                StringEquals:
                  sagemaker:ResourceTag/BudgetControlAction: 'Terminate'
    
        # Policy 3: SageMaker Domain management
        - PolicyName: SageMakerDomainPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
            - Effect: Allow
              Action:
                - sagemaker:DeleteDomain
              Resource: 
                Fn::Sub: arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:domain/*
              Condition:
                StringEquals:
                  sagemaker:ResourceTag/BudgetControlAction: 'Terminate'
            - Effect: Allow
              Action:
                - sagemaker:DeleteSpace
              Resource: 
                Fn::Sub: arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:space/*
            - Effect: Allow
              Action:
                - sagemaker:DeleteApp
              Resource: 
                Fn::Sub: arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:app/*
            - Effect: Allow
              Action:
                - sagemaker:DeleteUserProfile
              Resource: 
                Fn::Sub: arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:user-profile/*
    
        # Policy 4: OpenSearch management
        - PolicyName: OpenSearchManagementPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
            - Effect: Allow
              Action:
                - aoss:DeleteCollection
              Resource: 
                Fn::Sub: arn:${AWS::Partition}:aoss:${AWS::Region}:${AWS::AccountId}:collection/*
              Condition:
                StringEquals:
                  aws:ResourceTag/BudgetControlAction: 'Terminate'
            - Effect: Allow
              Action:
                - es:DeleteDomain
                - es:DeleteElasticsearchDomain
              Resource: 
                Fn::Sub: arn:${AWS::Partition}:es:${AWS::Region}:${AWS::AccountId}:domain/*
              Condition:
                StringEquals:
                  aws:ResourceTag/BudgetControlAction: 'Terminate'
    
        # Policy 5: KMS and Config permissions
        - PolicyName: KMSAndConfigPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
            - Effect: Allow
              Action:
                - kms:CreateGrant
                - kms:Decrypt
                - kms:DescribeKey
                - kms:GenerateDataKey
              Resource: 
                - Fn::Sub: arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*
                - !GetAtt SNSEncryptionKey.Arn
            - Effect: Allow
              Action:
                - config:StartConfigRulesEvaluation
                - config:DescribeConfigRuleEvaluationStatus
              Resource: 
                Fn::Sub: arn:${AWS::Partition}:config:${AWS::Region}:${AWS::AccountId}:config-rule/*              
    
        # Policy 6: RDS Cluster management - part 1
        - PolicyName: RDSClusterManagementPolicy1
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
            - Effect: Allow
              Action:
                - rds:CreateDBClusterSnapshot
                - rds:DeleteDBCluster
              Resource: 
                Fn::Sub: arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster-snapshot:*
            - Effect: Allow
              Action:
                - rds:DeleteDBCluster
              Resource: 
                Fn::Sub: arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster:*
              Condition:
                StringEquals:
                  aws:ResourceTag/BudgetControlAction: 'Terminate'
    
        # Policy 7: RDS Cluster management - part 2
        - PolicyName: RDSClusterManagementPolicy2
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
            - Effect: Allow
              Action:
                - rds:StopDBCluster
              Resource: 
                Fn::Sub: arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster:*
              Condition:
                StringEquals:
                  aws:ResourceTag/BudgetControlAction: 'Stop'
            - Effect: Allow
              Action:
                - rds:CreateDBClusterSnapshot
                - rds:DescribeDBClusters
                - rds:ModifyDBCluster
              Resource: 
                Fn::Sub: arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster:*
    
        # Policy 8: RDS Instance and Snapshot management
        - PolicyName: RDSInstanceSnapshotPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
            - Effect: Allow
              Action:
                - rds:CreateDBSnapshot
                - rds:DeleteDBInstance
                - rds:ModifyDBInstance
              Resource: 
                Fn::Sub: arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:*
            - Effect: Allow
              Action:
                - rds:CreateDBSnapshot
              Resource: 
                Fn::Sub: arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:snapshot:*
    
        # Policy 9: EC2 instance management
        - PolicyName: EC2ManagementPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
            - Effect: Allow
              Action:
                - ec2:StopInstances
              Resource: 
                Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
              Condition:
                StringEquals:
                  ec2:ResourceTag/BudgetControlAction: 'Stop'
            - Effect: Allow
              Action:
                - ec2:TerminateInstances
              Resource: 
                Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
              Condition:
                StringEquals:
                  ec2:ResourceTag/BudgetControlAction: 'Terminate'
    
        # Policy 10: SSM and DynamoDB access
        - PolicyName: SSMAndDynamoDBPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
            - Action: ssm:GetParameter
              Effect: Allow
              Resource:
                 - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ServiceActionMappingParameter}'
            - Action: 
                  - "dynamodb:PutItem"
                  - "dynamodb:UpdateItem"
              Effect: Allow
              Resource:
                  Fn::GetAtt:
                    - AuditResouceInfoActionStatus
                    - Arn
            - Action: 
                  - "dynamodb:scan"
                  - "dynamodb:DeleteItem"
              Effect: Allow
              Resource:
                  Fn::GetAtt:
                    - AuditResourceInfoDefaultTag 
                    - Arn