                              "S.$": "$$.Execution.Name"
                            },
                            "ActionTimestamp": {
                              "S.$": "States.Format('{}-{}', $$.State.EnteredTime, States.UUID())"
                            }                            
                          },
                          "UpdateExpression": "SET ResourceId = :ResourceId, ActionStatus = :completed, ActionDetails = :alreadyStopped,  AuditTimestamp = :auditTimestamp, ResourceType = :resourceType, TagApplied = :tag",
                          "ExpressionAttributeValues": {
