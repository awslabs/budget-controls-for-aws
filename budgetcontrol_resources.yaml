        Version: "2012-10-17"
      Path: "/"
      Policies:
        - PolicyName: Cloudwatch-logs-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action: 
                  - "logs:CreateLogGroup"
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*'
              - Effect: "Allow"
                Action:
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/aws-config-demo-lambda-add-tags:*'        
      ManagedPolicyArns:
        - Fn::Join:
            - ""
            - - "arn:"
              - Ref: AWS::Partition
              - :iam::aws:policy/service-role/AWSConfigRulesExecutionRole
  awsconfigNonCompliantResourceActionlambdaServiceRoleDefaultPolicy:
    Type: AWS::IAM::Policy
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W12
            reason: >-
              This policy requires broader resource access to effectively manage tagging across multiple AWS services including SageMaker notebooks, EC2 instances, OpenSearch domains, and DMS instances. Restricting permissions to specific resources would prevent the automated tagging system from functioning properly as new resources are created across your AWS environment    
    Properties:
      PolicyDocument:
        Statement:
          - Action: 
               - "sagemaker:AddTags"
               - "es:AddTags"
               - "ec2:CreateTags"
#               - "dms:AddTagsToResource"
               - "rds:AddTagsToResource"
            Effect: Allow
            Condition:
                  StringEquals:
                    aws:RequestTag/BudgetControlAction: 'Inform'
                  ForAllValues:StringEquals:
                    aws:TagKeys:
                      - BudgetControlAction
            Resource: "*"             
          - Action:
               - "rds:DescribeDBClusters"
            Effect:  Allow
            Resource: "*"
          - Action: ssm:GetParameter
            Effect: Allow
            Resource:
               - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ServiceActionMappingParameter}'                              
          - Action: dynamodb:PutItem
            Effect: Allow
            Resource:
                Fn::GetAtt:
                  - AuditResourceInfoDefaultTag 
                  - Arn
          # Add KMS permissions for SNS encryption
          - Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Effect: Allow
            Resource: !GetAtt SNSEncryptionKey.Arn
        Version: "2012-10-17"
      PolicyName: awsconfigNonCompliantResourceActionlambdaServiceRoleDefaultPolicy
      Roles:
        - !Ref awsconfigNonCompliantResourceActionlambdaServiceRole

  # Permission for EventBridge to invoke Lambda
  awsconfigNonCompliantResourceActionlambdaInvokePermission:
    Type: "AWS::Lambda::Permission"
    Properties:
      Action: "lambda:InvokeFunction"
      FunctionName: 
        Ref: awsconfigNonCompliantResourceActionlambda
      Principal: "events.amazonaws.com"
      SourceArn: 
        Fn::GetAtt: 
          - ConfigEventsRule
          - Arn
          
  awsconfigNonCompliantResourceActionlambda:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W92
            reason: >-
              This deployment is configured for simplified demonstration purposes. For production environments, we recommend configuring appropriate concurrency limits based on your organization's usage patterns and performance requirements
          - id: W89
            reason: >-
              This deployment is configured for simplified demonstration purposes. For production environments, we recommend deploying these resources within your VPC to enhance network security and meet your organization's compliance requirements
          - id: W58
            reason: The Lambda function has required permissions to write operational logs to CloudWatch        
    Properties:
      Code:
        ZipFile: |
            import boto3
            import json
            import logging
            import os
            from datetime import datetime
            from botocore.exceptions import ClientError
            logger = logging.getLogger(__name__)
            logger.setLevel(logging.INFO)
            ssm_client = boto3.client('ssm')
            config_client = boto3.client('config')
            dynamodb = boto3.resource('dynamodb')
            def get_action_from_ssm(resource_type):
                """
                Fetches the action value from SSM Parameter Store based on the resource type.
                """
                ssm_parameter_name = os.environ['SSM_TAG_PARAMETER']
                response = ssm_client.get_parameter(Name=ssm_parameter_name)
                tag_values = json.loads(response['Parameter']['Value'])
                return tag_values.get(resource_type)
            def log_to_dynamodb(resource_type, resource_id, tag_value,timestamp):
                """
                Logs the tagging action to DynamoDB with action_taken set to 'pending'.
                """
                table = dynamodb.Table(os.environ['DYNAMODB_TABLE_NAME'])
                item = {
                    'ResourceType': resource_type,
                    'ResourceId': resource_id,
                    'TagApplied': tag_value,
                    'ActionStatus': 'pending',
                    'AuditTimestamp' : timestamp,
                    'ComplianceStatus' : 'COMPLIANT',
                    'Reason' : 'Resource is compliant with tag policies'
                }
                try:
                    table.put_item(Item=item)
                    logger.info(f"Logged action to DynamoDB for resource {resource_id} of type {resource_type}")
                except ClientError as e:
                    logger.error(f"Error logging action to DynamoDB for resource {resource_id}: {e}")
            def add_tag_to_resource(resource_id, resource_type, tag_key, tag_value, aws_region, aws_account_id,timestamp):
                """
                Adds the BudgetControlAction tag to the resource and logs the action to DynamoDB.
                """
                client_map = {
                    'AWS::EC2::Instance': boto3.client('ec2'),
                    'AWS::RDS::DBCluster': boto3.client('rds'),
                    'AWS::SageMaker::Domain': boto3.client('sagemaker'),
                    'AWS::SageMaker::NotebookInstance': boto3.client('sagemaker'),
                    'AWS::OpenSearch::Domain': boto3.client('opensearch'),
                    'AWS::OpenSearchServerless::Collection': boto3.client('opensearchserverless'),
                    'AWS::DMS::ReplicationInstance': boto3.client('dms')
                }
                
                client = client_map.get(resource_type)
                
                # Construct the ARN if needed
                resource_identifier = construct_arn(resource_type, resource_id, aws_region, aws_account_id)
                
                 # EC2 instances do not require ARN construction
                if resource_type in ['AWS::EC2::Instance']:
                    resource_identifier = resource_id
                elif resource_type in ['AWS::RDS::DBCluster']:
                    cluster_info = client.describe_db_clusters(Filters=[{'Name': 'db-cluster-resource-id', 'Values': [resource_id]}])
                    resource_id = cluster_info['DBClusters'][0]['DBClusterIdentifier']
                    resource_identifier = construct_arn(resource_type, resource_id, aws_region, aws_account_id)
                else:
                    # Construct ARN for other resource types
                    resource_identifier = construct_arn(resource_type, resource_id, aws_region, aws_account_id)    
                
                if client:
                    try:
                        if resource_type == 'AWS::EC2::Instance':
                            client.create_tags(
                                Resources=[resource_identifier],  # For EC2, resource_identifier is resource_id
                                Tags=[{'Key': tag_key, 'Value': tag_value}]
                            )
                        elif resource_type == 'AWS::RDS::DBCluster':
                            client.add_tags_to_resource(
                                ResourceName=resource_identifier,  # For RDS, resource_identifier is ARN
                                Tags=[{'Key': tag_key, 'Value': tag_value}]
                            )
                        elif resource_type in ['AWS::SageMaker::Domain', 'AWS::SageMaker::NotebookInstance']:
                            client.add_tags(ResourceArn=resource_identifier, Tags=[{'Key': tag_key, 'Value': tag_value}])
                        elif resource_type in ['AWS::OpenSearch::Domain']:
                            print(resource_identifier)
                            response = client.add_tags(ARN=resource_identifier, TagList=[{'Key': tag_key, 'Value': tag_value}])                
                        elif resource_type in ['AWS::OpenSearchServerless::Collection']:
                            client.tag_resource(resourceArn=resource_identifier, TagList=[{'Key': tag_key, 'Value': tag_value}])
                        elif resource_type == 'AWS::DMS::ReplicationInstance':
                            client.add_tags_to_resource(ResourceArn=resource_identifier, Tags=[{'Key': tag_key, 'Value': tag_value}])
                        logger.info(f"Successfully added tag {tag_key}: {tag_value} to resource {resource_identifier}")
                        # Log the action to DynamoDB
                        log_to_dynamodb(resource_type, resource_id, tag_value,timestamp)
                    except Exception as e:
                        logger.error(f"Error adding tag to resource {resource_identifier} of type {resource_type}: {e}")
                else:
                    logger.warning(f"Unsupported resource type {resource_type}, skipping tagging.")
                    
            def construct_arn(resource_type, resource_id, aws_region, aws_account_id):
                """
                Constructs the ARN for resource types that require ARN instead of resource ID.
                """
                arn_map = {
                    'AWS::RDS::DBCluster': f"arn:aws:rds:{aws_region}:{aws_account_id}:cluster:{resource_id}",
                    'AWS::SageMaker::NotebookInstance': f"arn:aws:sagemaker:{aws_region}:{aws_account_id}:notebook-instance/{resource_id}",
                    'AWS::SageMaker::Domain': f"arn:aws:sagemaker:{aws_region}:{aws_account_id}:domain/{resource_id}",
                    'AWS::OpenSearch::Domain': f"arn:aws:es:{aws_region}:{aws_account_id}:domain/{resource_id}",
                    'AWS::OpenSearchServerless::Collection': f"arn:aws:opensearchserverless:{aws_region}:{aws_account_id}:collection/{resource_id}",
                    'AWS::DMS::ReplicationInstance': f"arn:aws:dms:{aws_region}:{aws_account_id}:rep:{resource_id}"
                }
                # If the resource type requires an ARN, return the constructed ARN
                return arn_map.get(resource_type, resource_id)
                
                
            def lambda_handler(event, context):
                """
                Lambda function handler triggered by EventBridge when there is a compliance change.
                The function adds the 'BudgetControlAction' tag to the resource and logs the action to DynamoDB.
                """
                logger.info(f"Received event: {json.dumps(event)}")
                timestamp = datetime.now().strftime('%Y-%m-%d %H:%M:%S')
                
                # Extract the resource details from the event
                detail = event.get('detail', {})
                resource_type = detail.get('resourceType')
                resource_id = detail.get('resourceId')
                compliance_type = detail.get('newEvaluationResult', {}).get('complianceType')
                aws_region = event.get('region')
                aws_account_id = detail.get('awsAccountId')
                
                # Only proceed if the resource is non-compliant
                if compliance_type == 'NON_COMPLIANT':
                    logger.info(f"Resource {resource_id} of type {resource_type} is NON_COMPLIANT")
                    # Fetch the appropriate action from SSM for the resource type
                    action = get_action_from_ssm(resource_type)
                    if action:
                        # Add the BudgetControlAction tag to the resource
                        add_tag_to_resource(resource_id, resource_type, 'BudgetControlAction', action, aws_region, aws_account_id,timestamp)
                    else:
                        logger.warning(f"No action found for resource type {resource_type} in SSM")
                else:
                    logger.info(f"Resource {resource_id} is compliant, no action needed.")

      Environment:
