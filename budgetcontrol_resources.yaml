  awsconfigcustomlambda:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W92
            reason: >-
              This deployment is configured for simplified demonstration purposes. For production environments, we recommend configuring appropriate concurrency limits based on your organization's usage patterns and performance requirements
          - id: W89
            reason: >-
              This deployment is configured for simplified demonstration purposes. For production environments, we recommend deploying these resources within your VPC to enhance network security and meet your organization's compliance requirements
          - id: W58
            reason: The Lambda function has required permissions to write operational logs to CloudWatch   
    Properties:
      Code:
        ZipFile: |
            import boto3
            import json
            import logging
            import os
            from datetime import datetime
            logger = logging.getLogger(__name__)
            logger.setLevel(logging.INFO)
            dynamodb = boto3.resource('dynamodb')
            table = dynamodb.Table(os.environ['DYNAMODB_TABLE_NAME'])
            def get_required_tag():
                ssm_client = boto3.client('ssm')
                response = ssm_client.get_parameter(Name=os.environ['SSM_TAG_PARAMETER'])
                required_tag = json.loads(response['Parameter']['Value'])
                return required_tag
            def save_compliance_result(evaluations, token):
                config_client = boto3.client('config')
                response = config_client.put_evaluations(
                    Evaluations=evaluations,
                    ResultToken=token,
                    TestMode=False
                )
                logger.info(f"Save evaluation results->{response}")
            def is_applicable(configurationItem, event):
                status = configurationItem['configurationItemStatus']
                eventLeftScope = event['eventLeftScope']
                if status == 'ResourceDeleted':
                    logger.info("Resource Deleted, setting Compliance Status to NOT_APPLICABLE.")
                return (status == 'OK' or status == 'ResourceDiscovered') and not eventLeftScope
            def send_notification(subject, message):
                topic_arn = os.environ['SNS_TOPIC_ARN']
                sns_client = boto3.client('sns')
                response = sns_client.publish(
                    TopicArn=topic_arn,
                    Message=message,
                    Subject=subject
                )
                message_id = response['MessageId']
                logger.info(f'SNS topic message is published {message_id}')
            def get_resource_tags(resource_id, resource_type):
                client_map = {
                    'AWS::EC2::Instance': boto3.client('ec2'),
                    'AWS::RDS::DBCluster': boto3.client('rds'),
                    'AWS::SageMaker::Domain': boto3.client('sagemaker'),
                    'AWS::SageMaker::NotebookInstance': boto3.client('sagemaker'),
                    'AWS::OpenSearch::Domain': boto3.client('opensearch'),
                    'AWS::OpenSearchServerless::Collection': boto3.client('opensearchserverless'),
                    'AWS::DMS::ReplicationInstance': boto3.client('dms')
                }
                
                client = client_map.get(resource_type)
                if client:
                    if resource_type == 'AWS::EC2::Instance':
                        response = client.describe_tags(Filters=[{'Name': 'resource-id', 'Values': [resource_id]}])
                        return response.get('Tags', [])
                    elif resource_type == 'AWS::RDS::DBCluster':
                        response = client.list_tags_for_resource(ResourceName=resource_id)
                        return response.get('TagList', [])
                    elif resource_type in ['AWS::SageMaker::Domain', 'AWS::SageMaker::NotebookInstance']:
                        response = client.list_tags(ResourceArn=resource_id)
                        return response.get('Tags', [])
                    elif resource_type in ['AWS::OpenSearch::Domain', 'AWS::OpenSearchServerless::Collection']:
                        response = client.list_tags(ARN=resource_id)
                        return response.get('TagList', [])
                    elif resource_type == 'AWS::DMS::ReplicationInstance':
                        response = client.list_tags_for_resource(ResourceArn=resource_id)
                        return response.get('TagList', [])
                else:
                    logger.warning(f"Unsupported resource type {resource_type} for tagging.")
                    return []
            def check_tags_compliance(configurationItem, required_tag):
                resource_type = configurationItem['resourceType']
                resource_id = configurationItem['resourceId'] if resource_type == 'AWS::EC2::Instance' else configurationItem['ARN']
                logger.info(f"Evaluating resource {resource_id} of type {resource_type}")
                
                tags = get_resource_tags(resource_id, resource_type)
                for tag in tags:
                    if tag['Key'] == required_tag['Key'] and tag['Value'].lower() in [val.lower() for val in required_tag['Values']]:
                        return tag['Value']  # Resource is compliant
                
                return None  # No valid tag found
            def save_audit_info(resource_info, compliance_status, timestamp, reason, tag_applied):	
                table.put_item(Item={
                    'ResourceId': resource_info['resourceId'],
                    'ResourceType': resource_info['resourceType'],
                    'ComplianceStatus': compliance_status,
                    'TagApplied': tag_applied,
                    'ActionStatus': 'pending',
                    'AuditTimestamp': timestamp,
                    'Reason': reason
                })            
            def create_plaintext_table(audit_info):
                report = "Resource Compliance Status Report\n"
                report += "-" * 50 + "\n"
                report += "{:<20} {:<30} {:<20} {:<30} {:<30}\n".format("AWS Account ID", "Resource Type", "Resource ID", "Compliance Status", "Reason")
                report += "-" * 50 + "\n"
                
                for item in audit_info:
                    report += "{:<20} {:<30} {:<20} {:<30} {:<30}\n".format(
                        item['awsAccountId'],
                        item['resourceType'],
                        item['resourceId'],
                        item['ComplianceStatus'],
                        item['Reason']
                    )
                
                return report
                    
            def lambda_handler(event, context):
                logger.info(event)
                invoking_event = json.loads(event['invokingEvent'])
                configuration_items = invoking_event.get('configurationItems', [invoking_event['configurationItem']])
                evaluations = []
                audit_info = []
                required_tag = get_required_tag()  # Fetch dynamic tag values
                timestamp = datetime.now().strftime('%Y-%m-%d %H:%M:%S')
                for configuration_item in configuration_items:
                    reason = None
                    if not is_applicable(configuration_item, event):
                        compliant_status = 'NOT_APPLICABLE'
                        reason = 'Resource is deleted or left scope'
                    else:
                        tag_applied = check_tags_compliance(configuration_item, required_tag)
                        if tag_applied is not None: 
                            compliant_status = 'COMPLIANT'
                            reason = f"Resource is compliant with tag policies, set to {tag_applied}"
                        else:
                            compliant_status = 'NON_COMPLIANT'
                            reason = f"Missing required tag value(s): {required_tag['Values']}"
                        
                        audit_info.append({
                            'awsAccountId': configuration_item['awsAccountId'],
                            'resourceType': configuration_item['resourceType'],
                            'resourceId': configuration_item['resourceId'],
                            'ComplianceStatus': compliant_status,
                            'Reason': reason,
                            'Timestamp': timestamp
                        })
                        save_audit_info(configuration_item, compliant_status, timestamp, reason, tag_applied)
                    evaluations.append({
                        'ComplianceResourceType': configuration_item['resourceType'],
                        'ComplianceResourceId': configuration_item['resourceId'],
                        'ComplianceType': compliant_status,
                        'OrderingTimestamp': configuration_item['configurationItemCaptureTime'],
                        'Annotation': reason
                    })
                save_compliance_result(evaluations, event['resultToken'])
                if audit_info:
                    report_plaintext = create_plaintext_table(audit_info)
                    subject = 'AWS Config Compliance Report'
                    send_notification(subject, report_plaintext)

      Environment:
        Variables:
          DYNAMODB_TABLE_NAME:
            Ref: AuditResourceInfoDefaultTag 
          SNS_TOPIC_ARN:
            Ref: awsconfigbudgetcontrolnotificationtopic
          SSM_TAG_PARAMETER:
            Ref: ServiceResourceTagParameter            
      FunctionName: aws-config-demo-lambda-check-tags
      Description: This is demo lambda used by AWS Config custom rule to check tags on SageMaker Notebook Instance.
      Handler: index.lambda_handler
      Role:
        Fn::GetAtt:
