Parameters:
  NotificationEmail:
    Type: String
  BudgetAmount:  # UPDATED:  Added a parameter for the budget amount.
    Type: Number
    Description: The total budget amount per month. Do not include dollar sign.
Resources:
  # Create a Customer Managed Key (CMK) for SNS topic encryption
  SNSEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for SNS topic encryption
      Enabled: true
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Id: key-policy-sns
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow SNS to use the key
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: '*'
          - Sid: Allow Budgets Service to use the key
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: '*'
          - Sid: Allow Config Service to use the key
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: '*'
          - Sid: Allow Lambda to use the key
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: '*'

  # Create an alias for the KMS key
  SNSEncryptionKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/sns-encryption-key
      TargetKeyId: !Ref SNSEncryptionKey

  ConfigEventsRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Trigger Lambda to add tag and default value to Non-Compliant resources
      EventPattern:
        source:
          - aws.config
        detail-type:
          - Config Rules Compliance Change
        detail:
          configRuleName:
              - Ref: awscustomlambdaconfigdemorule
          newEvaluationResult:
            complianceType:
              - NON_COMPLIANT
      State: ENABLED
      Targets:
        - Arn: 
            Fn::GetAtt:
              - awsconfigNonCompliantResourceActionlambda
              - Arn
          Id: "TargetLambda"            
  # SSM Parameter Store for Service-to-Action Mapping
  ServiceActionMappingParameter:
    Type: "AWS::SSM::Parameter"
    Properties:
      Type: "String" # UPDATED: All values must be Inform for the initial default.
      Value: |
        {
          "AWS::SageMaker::NotebookInstance": "Inform",
          "AWS::EC2::Instance": "Inform",
          "AWS::SageMaker::Domain" : "Inform",
          "AWS::OpenSearch::Domain" : "Inform",
          "AWS::Elasticsearch::Domain" : "Inform",
          "AWS::RDS::DBCluster" : "Inform"
        }
      Description: "Mapping of AWS services to the actions (Stop, Terminate, or no action)"

  # SSM Parameter Store Budget Action control Key and tag values
  ServiceResourceTagParameter:
    Type: "AWS::SSM::Parameter"
    Properties:
      Type: "String"
      Value: |
        {
          "Key": "BudgetControlAction", "Values": ["Inform", "Stop", "Terminate"]
        }
      Description: "Budget Control Action Key value pairs"      
      
  AuditResourceInfoDefaultTag :
      Type: 'AWS::DynamoDB::Table'
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: ResourceId
            AttributeType: S        
        KeySchema:
          - AttributeName: ResourceId
            KeyType: HASH
        SSESpecification:
          SSEEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
  AuditResouceInfoActionStatus:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ExecutionID
          AttributeType: S  
        - AttributeName: ActionTimestamp
          AttributeType: S            
      KeySchema:
        - AttributeName: ExecutionID
          KeyType: HASH
        - AttributeName: ActionTimestamp
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true          
          

  # AWS Budget
  Budget:
    Type: "AWS::Budgets::Budget"
    Properties:
      Budget:
        BudgetName: "MonthlyCostBudget"
        BudgetType: "COST"
        TimeUnit: "MONTHLY"
        BudgetLimit:
          Amount: !Ref BudgetAmount  # UPDATED:  From new parameter above
          Unit: "USD"
      NotificationsWithSubscribers:
        - Notification:  # UPDATED:  New notification to send out reminder at 80% 
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 80
            ThresholdType: "PERCENTAGE"
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref awsconfigbudgetcontrolnotificationtopic
        - Notification:
            NotificationType: "ACTUAL"
            ComparisonOperator: "GREATER_THAN"
            Threshold: 90
            ThresholdType: "PERCENTAGE"
          Subscribers:
            - SubscriptionType: "SNS"
              Address: !Ref BudgetAlertSFActionTopic


  # SNS Topic for Budget Alerts - Now using CMK
  BudgetAlertSFActionTopic:
    Type: "AWS::SNS::Topic"
    Properties:
      DisplayName: Topic to trigger Step functions to take action
      TopicName: aws-budgets-threshold-action-alert
      KmsMasterKeyId: !Ref SNSEncryptionKey
      
  BudgetAlertSNSActionTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref BudgetAlertSFActionTopic
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref BudgetAlertSFActionTopic  
 
 # SNS Topic Subscription for Budget Alerts
  SnsSubscriptionForBudget:
    Type: "AWS::SNS::Subscription"
    Properties:
      Endpoint: !GetAtt LambdaTriggerSFFunction.Arn
      Protocol: "lambda"
      TopicArn: !Ref BudgetAlertSFActionTopic

  LambdaTriggerSFFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref "AWS::AccountId"
        Version: "2012-10-17"
      Path: "/"
      Policies:
        - PolicyName: Cloudwatch-logs-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action: 
                  - "logs:CreateLogGroup"
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*'
              - Effect: "Allow"
                Action:
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/aws-config-demo-lambda-sf-action:*'        
      ManagedPolicyArns:
        - Fn::Join:
            - ""
            - - "arn:"
              - Ref: AWS::Partition
              - :iam::aws:policy/service-role/AWSConfigRulesExecutionRole
  LambdaTriggerSFFunctionRoleDefaultPolicy:
    Type: AWS::IAM::Policy
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W12
            reason: >-
              This policy requires broad resource access to effectively manage tagging across multiple AWS service types including SageMaker notebooks, EC2 instances, OpenSearch domains, and DMS instances. Restricting to specific resources would prevent the automated tagging functionality from working properly across your environment    
    Properties:
      PolicyDocument:
        Statement:
          - Action: 
               - "states:StartExecution"
            Effect: Allow
            Resource: !Ref StateMachineBudgetControl                           
        Version: "2012-10-17"
      PolicyName: LambdaTriggerSFFunctionRoleDefaultPolicy
      Roles:
        - !Ref LambdaTriggerSFFunctionRole

  PermissionForBudgetAlertSFActionTopicToInvokeLambda: 
    Type: AWS::Lambda::Permission
    Properties: 
      FunctionName: !GetAtt LambdaTriggerSFFunction.Arn 
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceAccount: !Ref AWS::AccountId      
      SourceArn: !Ref BudgetAlertSFActionTopic
                
  LambdaTriggerSFFunction:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W92
            reason: >-
              This deployment is configured for simplified demonstration purposes. For production environments, we recommend configuring appropriate concurrency limits based on your organization's usage patterns and performance requirements
          - id: W89
            reason: >-
              This deployment is configured for simplified demonstration purposes. For production environments, we recommend deploying these resources within your VPC to enhance network security and meet your organization's compliance requirements
          - id: W58
            reason: The Lambda function has required permissions to write operational logs to CloudWatch      
    Properties:
      FunctionName: aws-config-demo-lambda-sf-action
      Description: This is demo lambda to trigger step functions to take action on resources based on tag value
      Handler: index.lambda_handler
      Runtime: python3.13
      Timeout: 900
      MemorySize: 128      
      Role: !GetAtt LambdaTriggerSFFunctionRole.Arn
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref StateMachineBudgetControl      
      Code:
        ZipFile: |
            import json
            import boto3
            import os
            from datetime import datetime
            def json_serial(obj):
                """JSON serializer for objects not serializable by default json code"""
                if isinstance(obj, datetime):
                    return obj.isoformat()
                raise TypeError("Type not serializable")
            def start_step_function(payload):
                client = boto3.client('stepfunctions')
                response = client.start_execution(
                    stateMachineArn=os.environ['STATE_MACHINE_ARN'],
                    name=payload["message_id"]  # Use MessageId as the name
                )
                return response
            def lambda_handler(event, context):
                try:
                    # Store the last response to return
                    last_response = None
                    
                    # Iterate through records
                    for record in event["Records"]:
                        payload = {
                            "message_id": record["Sns"]["MessageId"],
                            "message": record["Sns"]["Message"],
                            "topic_arn": record["Sns"]["TopicArn"],
                            "subject": record["Sns"].get("Subject", "")
                        }
                        
                        # Start Step Function
                        response = start_step_function(payload)
                        last_response = response
                    
                    # Return the last response, converting datetime to ISO format
                    return json.loads(json.dumps(last_response, default=json_serial))
                
                except Exception as e:
                    print(f"Error: {str(e)}")
                    raise  
                    
  # Email notification topic - Now using CMK
  awsconfigbudgetcontrolnotificationtopic:
    Type: AWS::SNS::Topic    
    Properties:
