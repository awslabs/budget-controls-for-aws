                            "StringEquals": "Stop",
                            "Next": "Stop Instance"
                          },
                          {
                            "Variable": "$.TagApplied",
                            "StringEquals": "Terminate",
                            "Next": "Terminate Instance"
                          },
                          {
                            "Variable": "$.TagApplied",
                            "StringEquals": "Inform",
                            "Next": "Update_Action_Status_EC2_Inform"
                          }
                        ],
                        "Default": "Update_Action_Status_EC2_Unknown_Tag"
                      },
                      "Handle Stopped State": {
                        "Type": "Choice",
                        "Choices": [
                          {
                            "Variable": "$.TagApplied",
                            "StringEquals": "Stop",
                            "Next": "Update_Action_Status_EC2_Already_Stopped"
                          },
                          {
                            "Variable": "$.TagApplied",
                            "StringEquals": "Terminate",
                            "Next": "Terminate Instance"
                          },
                          {
                            "Variable": "$.TagApplied",
                            "StringEquals": "Inform",
                            "Next": "Update_Action_Status_EC2_Inform"
                          }
                        ],
                        "Default": "Update_Action_Status_EC2_Unknown_Tag"
                      },
                      "Stop Instance": {
                        "Type": "Task",
                        "Resource": "arn:aws:states:::aws-sdk:ec2:stopInstances",
                        "Parameters": {
                          "InstanceIds.$": "States.Array($.InstanceId)"
                        },
                        "ResultPath": "$.StoppingInstances",
                        "Next": "Update_Action_Status_EC2_Stopped",
                        "Retry": [
                          {
                            "ErrorEquals": [
                              "States.TaskFailed"
                            ],
                            "BackoffRate": 2,
                            "MaxAttempts": 3,
                            "IntervalSeconds": 30,
                            "JitterStrategy": "FULL"
                          }
                        ]
                      },
                      "Terminate Instance": {
                        "Type": "Task",
                        "Resource": "arn:aws:states:::aws-sdk:ec2:terminateInstances",
                        "Parameters": {
                          "InstanceIds.$": "States.Array($.InstanceId)"
                        },
                        "ResultPath": "$.TerminatingInstances",
                        "Next": "Update_Action_Status_EC2_Terminated",
                        "Retry": [
                          {
                            "ErrorEquals": [
                              "States.TaskFailed"
                            ],
                            "BackoffRate": 2,
                            "MaxAttempts": 3,
                            "IntervalSeconds": 30,
                            "JitterStrategy": "FULL"
                          }
                        ]
                      },
                      "Update_Action_Status_EC2_Already_Stopped": {
                        "Type": "Task",
                        "Resource": "arn:aws:states:::aws-sdk:dynamodb:updateItem",
                        "Parameters": {
                          "TableName": "${AuditResouceInfoActionStatus}",
